<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404 | Página não encontrada</title>
    <style>

        * {
            color: white;
            box-sizing: border-box;
        }
        body{
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        p {
            color: #b0b0b0;
            margin-bottom: 25px;
            font-size: 16px;
        }

        a{
            background-color: rgb(68, 68, 68);
            padding: 10px 20px;
            border: 4px solid rgb(137, 137, 137);
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 0 7px 0px rgb(98, 97, 95);
            transition: all 0.3s;
            display: inline-block;
            font-weight: bold;
        }
        a:hover{
            background-color: rgb(19, 84, 90);
            border: 4px solid #00ffcc;
            opacity: 0.9;
            box-shadow: 0 0 10px 0px wheat;
        }
        
    </style>
</head>
<body>

    <h2>ERRO 404: PÁGINA NÃO ENCONTRADA</h2>
    <p>Clique no botão abaixo para retornar para a página inicial.</p>
    <a href="https://ms-office-setup.vercel.app/">Voltar ao Início</a>

</body>
</html>
